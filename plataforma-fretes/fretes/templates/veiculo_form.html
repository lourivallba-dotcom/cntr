{% extends "base.html" %}
{% block titulo %}Meu veículo{% endblock %}
{% block conteudo %}
<div class="estreito">
<h1>Meu veículo</h1>
{% if erros %}<div class="alerta alerta-erro"><ul>{% for e in erros %}<li>{{ e }}</li>{% endfor %}</ul></div>{% endif %}
<form method="post" action="/perfil/veiculo" class="card form">
  <input type="hidden" name="proximo" value="{{ proximo }}">
  <div class="campo"><label>Tipo de veículo</label><select name="tipo_veiculo" required><option value=""></option>{% for cod, nome in VEICULOS.items() %}<option value="{{ cod }}" {% if dados.tipo_veiculo == cod %}selected{% endif %}>{{ nome }}</option>{% endfor %}</select></div>
  <div class="campo"><label>Carroceria</label><select name="carroceria" required><option value=""></option>{% for cod, nome in CARROCERIAS.items() %}<option value="{{ cod }}" {% if dados.carroceria == cod %}selected{% endif %}>{{ nome }}</option>{% endfor %}</select></div>
  <div class="campo"><label>Placa</label><input name="placa" required placeholder="ABC1D23" value="{{ dados.placa or '' }}"></div>
  <div class="campo"><label>RNTRC (ANTT)</label><input name="rntrc" inputmode="numeric" value="{{ dados.rntrc or '' }}"></div>
  <div class="campo"><label>Capacidade (kg)</label><input name="capacidade_kg" inputmode="numeric" value="{{ dados.capacidade_kg or '' }}"></div>
  <button class="btn">Salvar veículo</button>
</form>
</div>
{% endblock %}
